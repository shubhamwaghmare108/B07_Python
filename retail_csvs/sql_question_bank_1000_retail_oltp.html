d_at) as cohort, COUNT(*) as customers FROM customer GROUP BY cohort;", "solved": false}, {"id": 767, "text": "Product sales trend analysis.", "diff": "Expert", "concept": "Advanced Analytics", "hint": "", "sql": "SELECT p.product_name, DATE(so.order_date) as order_date, SUM(soi.quantity) as qty_sold FROM sales_order_items soi JOIN sales_orders so ON soi.order_id = so.order_id JOIN products p ON soi.product_id = p.product_id GROUP BY p.product_id, DATE(so.order_date);", "solved": false}, {"id": 768, "text": "Market basket analysis (products often bought together).", "diff": "Expert", "concept": "Advanced Analytics", "hint": "Self JOIN", "sql": "SELECT p1.product_name, p2.product_name, COUNT(*) as times_bought_together FROM sales_order_items soi1 JOIN sales_order_items soi2 ON soi1.order_id = soi2.order_id AND soi1.product_id < soi2.product_id JOIN products p1 ON soi1.product_id = p1.product_id JOIN products p2 ON soi2.product_id = p2.product_id GROUP BY p1.product_id, p2.product_id;", "solved": false}, {"id": 769, "text": "Identify churned customers (no orders in last 6 months).", "diff": "Expert", "concept": "Advanced Analytics", "hint": "LEFT JOIN", "sql": "SELECT c.customer_name FROM customer c LEFT JOIN sales_orders so ON c.customer_id = so.customer_id AND so.order_date > DATE_SUB(NOW(), INTERVAL 6 MONTH) WHERE so.order_id IS NULL;", "solved": false}, {"id": 770, "text": "Customer segmentation by purchase frequency.", "diff": "Expert", "concept": "Advanced Analytics", "hint": "GROUP BY with CASE", "sql": "SELECT c.customer_name, COUNT(so.order_id) as purchase_count, CASE WHEN COUNT(so.order_id) >= 10 THEN 'VIP' WHEN COUNT(so.order_id) >= 5 THEN 'Regular' ELSE 'Occasional' END as segment FROM customer c LEFT JOIN sales_orders so ON c.customer_id = so.customer_id GROUP BY c.customer_id, c.customer_name;", "solved": false}, {"id": 771, "text": "Advanced aggregation analysis 0.", "diff": "Expert", "concept": "Advanced Analytics", "hint": "", "sql": "SELECT COUNT(*), _date) as month, SUM(total_amount) as sales FROM sales_orders GROUP BY DATE_TRUNC('month', order_date)) t;", "id": 961, "solved": false}, {"text": "Find stores with declining sales trends.", "diff": "Expert", "concept": "Advanced Analytics", "hint": "", "sql": "SELECT store_id, SUM(CASE WHEN sales_trend < 0 THEN 1 ELSE 0 END) as declining_months FROM (SELECT store_id, LAG(monthly_sales) OVER (PARTITION BY store_id ORDER BY month) - monthly_sales as sales_trend FROM (SELECT store_id, DATE_TRUNC('month', order_date) as month, SUM(total_amount) as monthly_sales FROM sales_orders GROUP BY store_id, month) t) t2 GROUP BY store_id;", "id": 962, "solved": false}, {"text": "Identify products with stockout issues.", "diff": "Hard", "concept": "Advanced Analytics", "hint": "Find quantity_on_hand = 0", "sql": "SELECT p.product_name, COUNT(i.inventory_id) as zero_stock_locations FROM products p JOIN inventory i ON p.product_id = i.product_id WHERE i.quantity_on_hand = 0 GROUP BY p.product_id, p.product_name;", "id": 963, "solved": false}, {"text": "Calculate inventory turnover ratio by product.", "diff": "Expert", "concept": "Advanced Analytics", "hint": "COGS / Average Inventory", "sql": "SELECT p.product_name, SUM(soi.quantity * soi.unit_price) / AVG(i.quantity_on_hand) as turnover_ratio FROM products p JOIN sales_order_items soi ON p.product_id = soi.product_id JOIN inventory i ON p.product_id = i.product_id GROUP BY p.product_id, p.product_name;", "id": 964, "solved": false}, {"text": "Find suppliers with the best payment terms.", "diff": "Medium", "concept": "Advanced Analytics", "hint": "Order by payment_days ASC", "sql": "SELECT supplier_name, payment_days, lead_time_days FROM suppliers ORDER BY payment_days ASC, lead_time_days ASC LIMIT 10;", "id": 965, "solved": false}, {"text": "Analyze sales by customer age group.", "diff": "Hard", "concept": "Advanced Analytics", "hint": "GROUP BY age_group", "sql": "SELECT c.age_group, COUNT(so.order_id) as order_count, SUM(so.total_amount) as total_sales, AVG(so.total_amount) as avg_order_value FROM customer c LEFT JOIN sales_orders so ON c.customer_id = so.customer_id GROUP BY c.age_group;", "id": 966, "solved": false}, {"text": "Find product cross-selling opportunities.", "diff": "Expert", "concept": "Advanced Analytics", "hint": "Self JOIN sales_order_items", "sql": "SELECT p1.product_name, p2.product_name, COUNT(*) as co_purchase_count FROM sales_order_items soi1 JOIN sales_order_items soi2 ON soi1.order_id = soi2.order_id AND soi1.product_id < soi2.product_id JOIN products p1 ON soi1.product_id = p1.product_id JOIN products p2 ON soi2.product_id = p2.product_id GROUP BY p1.product_id, p2.product_id HAVING COUNT(*) > 5 ORDER BY co_purchase_count DESC;", "id": 967, "solved": false}, {"text": "Identify high-value customers (top 20% by spend).", "diff": "Hard", "concept": "Advanced Analytics", "hint": "Use percentile", "sql": "WITH customer_spend AS (SELECT c.customer_id, c.customer_name, SUM(so.total_amount) as total_spend FROM customer c LEFT JOIN sales_orders so ON c.customer_id = so.customer_id GROUP BY c.customer_id, c.customer_name) SELECT customer_id, customer_name, total_spend FROM customer_spend WHERE total_spend >= (SELECT PERCENTILE_CONT(0.8) WITHIN GROUP (ORDER BY total_spend) FROM customer_spend);", "id": 968, "solved": false}, {"text": "Compare performance across store types.", "diff": "Hard", "concept": "Advanced Analytics", "hint": "GROUP BY store_type", "sql": "SELECT s.store_type, COUNT(DISTINCT s.store_id) as store_count, COUNT(so.order_id) as total_orders, SUM(so.total_amount) as total_sales, AVG(so.total_amount) as avg_order_value FROM stores s LEFT JOIN sales_orders so ON s.store_id = so.store_id GROUP BY s.store_type;", "id": 969, "solved": false}, {"text": "Analyze return rate by product category.", "diff": "Hard", "concept": "Advanced Analytics", "hint": "JOIN with categories", "sql": "SELECT c.category_name, COUNT(sr.return_id) as return_count, COUNT(DISTINCT so.order_id) as total_orders, ROUND(COUNT(sr.return_id) * 100.0 / COUNT(DISTINCT so.order_id), 2) as return_rate FROM categories c JOIN products p ON c.category_id = p.category_id JOIN sales_order_items soi ON p.product_id = soi.product_id JOIN sales_orders so ON soi.order_id = so.order_id LEFT JOIN sales_returns sr ON so.order_id = sr.order_id LEFT JOIN sales_return_items sri ON sr.return_id = sri.return_id AND soi.order_item_id = sri.order_item_id GROUP BY c.category_id, c.category_name;", "id": 970, "solved": false}, {"text": "Advanced query combining multiple aggregations 0.", "diff": "Expert", "concept": "Advanced Analytics", "hint": "Multiple JOINs with GROUP BY", "sql": "SELECT p.product_name, b.brand_name, c.category_name, COUNT(soi.order_item_id) as times_ordered, SUM(soi.quantity) as total_qty, SUM(soi.net_price) as total_revenue FROM products p LEFT JOIN brands b ON p.brand_id = b.brand_id LEFT JOIN categories c ON p.category_id = c.category_id LEFT JOIN sales_order_items soi ON p.product_id = soi.product_id GROUP BY p.product_id ORDER BY total_revenue DESC;", "id": 971, "solved": false}, {"text": "Complex business intelligence query 1.", "diff": "Expert", "concept": "Advanced Analytics", "hint": "CTE with window functions", "sql": "WITH sales_by_store AS (SELECT store_id, DATE_TRUNC('month', order_date) as month, SUM(total_amount) as monthly_sales FROM sales_orders GROUP BY store_id, DATE_TRUNC('month', order_date)) SELECT store_id, month, monthly_sales, LAG(monthly_sales) OVER (PARTITION BY store_id ORDER BY month) as prev_month_sales FROM sales_by_store ORDER BY store_id, month;", "id": 972, "solved": false}, {"text": "Operational analytics query 2.", "diff": "Hard", "concept": "Advanced Analytics", "hint": "Performance measurement", "sql": "SELECT s.store_id, s.store_name, COUNT(DISTINCT so.customer_id) as unique_customers, COUNT(so.order_id) as total_orders, SUM(so.total_amount) as revenue, AVG(so.total_amount) as avg_order_value FROM stores s LEFT JOIN s const solved = new Set(JSON.parse(localStorage.getItem('sql_solved') || '[]').map(Number));

const concepts = [...new Set(ALL_QUESTIONS.map(q=>q.concept))];
const conceptSel = document.getElementById('f-concept');
concepts.forEach(c => { const o = document.createElement('option'); o.value=c; o.textContent=c; conceptSel.appendChild(o); });

let filtered = [...ALL_QUESTIONS];
let page = 1;
const PER_PAGE = 20;

function saveSolved() {
  try { localStorage.setItem('sql_solved', JSON.stringify([...solved])); } catch(e){}
}

function updateStats() {
  const total = filtered.length;
  const totalSolved = ALL_QUESTIONS.filter(q=>solved.has(q.id)).length;
  document.getElementById('s-total').textContent = ALL_QUESTIONS.length;
  document.getElementById('s-solved').textContent = totalSolved;
  document.getElementById('s-filtered').textContent = total;
  document.getElementById('s-pct').textContent = Math.round(totalSolved*100/ALL_QUESTIONS.length)+'%';
  document.getElementById('prog').style.width = Math.round(totalSolved*100/ALL_QUESTIONS.length)+'%';
}

function applyFilters() {
  const search = document.getElementById('search').value.toLowerCase();
  const diff = document.getElementById('f-diff').value;
  const concept = document.getElementById('f-concept').value;
  const status = document.getElementById('f-status').value;
  filtered = ALL_QUESTIONS.filter(q => {
    if(search && !q.text.toLowerCase().includes(search)) return false;
    if(diff && q.diff !== diff) return false;
    if(concept && q.concept !== concept) return false;
    if(status === 'solved' && !solved.has(q.id)) return false;
    if(status === 'unsolved' && solved.has(q.id)) return false;
    return true;
  });
  page = 1;
  render();
}

function render() {
  updateStats();
  const start = (page-1)*PER_PAGE;
  const pageItems = filtered.slice(start, start+PER_PAGE);
  const list = document.getElementById('q-list');
  if(filtered.length === 0) {
    list.innerHTML = '<div class="no-results">No questions match your filters.</div>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }
  list.innerHTML = pageItems.map(q => {
    const isSolved = solved.has(q.id);
    return `<div class="q-card${isSolved?' solved':''}" id="qc-${q.id}" onclick="toggleCard(${q.id}, event)">
      <div class="q-top">
        <span class="q-num">#${q.id}</span>
        <span class="q-text">${q.text}</span>
        <button class="solved-btn${isSolved?' done':''}" onclick="markSolved(${q.id}, event)">${isSolved?'✓ Done':'Mark done'}</button>
      </div>
      <div class="q-badges">
        <span class="badge b-${q.diff.toLowerCase()}">${q.diff}</span>
        <span class="badge b-concept">${q.concept}</span>
      </div>
      <div class="q-answer">
        ${q.hint?`<p class="hint">Hint: ${q.hint}</p>`:''}
        <pre>${q.sql}</pre>
      </div>
    </div>`;
  }).join('');
  renderPagination();
}

function toggleCard(id, e) {
  if(e.target.classList.contains('solved-btn')) return;
  const card = document.getElementById('qc-'+id);
  card.classList.toggle('open');
}

function markSolved(id, e) {
  e.stopPropagation();
  if(solved.has(id)) { solved.delete(id); } else { solved.add(id); }
  saveSolved();
  render();
}

function renderPagination() {
  const totalPages = Math.ceil(filtered.length / PER_PAGE);
  const pg = document.getElementById('pagination');
  if(totalPages <= 1) { pg.innerHTML=''; return; }
  let html = `<button onclick="goPage(1)" ${page===1?'disabled':''}>«</button>
    <button onclick="goPage(${page-1})" ${page===1?'disabled':''}>‹</button>
    <span>Page ${page} of ${totalPages}</span>
    <button onclick="goPage(${page+1})" ${page===totalPages?'disabled':''}>›</button>
    <button onclick="goPage(${totalPages})" ${page===totalPages?'disabled':''}>»</button>`;
  pg.innerHTML = html;
}

function goPage(p) {
  page = p;
  render();
  window.scrollTo(0,0);
}

render();
</script>
